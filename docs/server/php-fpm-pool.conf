; /etc/php/8.3/fpm/pool.d/tryoutnakes.conf
; Pool khusus aplikasi (VPS 2 vCPU / 4 GB RAM). Lihat tabel tuning di INSTALL-VPS.md.
[tryoutnakes]
user = deploy
group = www-data
listen = /run/php/php8.3-fpm-tryoutnakes.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = dynamic
pm.max_children = 24
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10
pm.max_requests = 500
request_terminate_timeout = 120s

php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 12M
php_admin_value[post_max_size] = 14M
php_admin_value[max_execution_time] = 60
php_admin_value[expose_php] = Off
php_admin_value[error_log] = /var/log/php8.3-fpm-tryoutnakes.log
php_admin_flag[log_errors] = on
