; /etc/supervisor/conf.d/tryoutnakes.conf
[program:tryoutnakes-queue]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php /var/www/tryoutnakes/artisan queue:work redis --sleep=3 --tries=3 --backoff=60 --max-time=3600 --memory=192
directory=/var/www/tryoutnakes
user=deploy
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/tryoutnakes/storage/logs/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
