# /etc/nginx/sites-available/tryoutnakes
# Setelah Certbot berjalan, blok SSL di bawah akan otomatis dilengkapi.

server {
    listen 80;
    listen [::]:80;
    server_name bynama.id;
    root /var/www/tryoutnakes/public;

    # Dipakai Certbot untuk verifikasi
    location ^~ /.well-known/acme-challenge/ { allow all; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name bynama.id;
    root /var/www/tryoutnakes/public;
    index index.php;
    charset utf-8;

    # --- SSL (diisi Certbot) ---
    ssl_certificate     /etc/letsencrypt/live/bynama.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bynama.id/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # --- Header keamanan ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upload bukti bayar / gambar soal
    client_max_body_size 12M;

    # --- Kompresi ---
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/json application/javascript image/svg+xml font/woff2;

    # --- Aset statis: cache panjang (nama file Vite sudah ber-hash) ---
    location ^~ /build/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }
    location ^~ /vendor/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }
    location ~* ^/(images|storage)/.+\.(webp|png|jpe?g|gif|svg|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }
    location = /favicon.ico { access_log off; log_not_found off; expires 30d; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm-tryoutnakes.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;
        internal;
    }

    # Tolak akses file PHP lain & file tersembunyi
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }

    error_page 404 /index.php;
}
